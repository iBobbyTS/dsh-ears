language: en-US
tone_instructions: Be concise. Follow the language and development rules in AGENTS.md.

reviews:
  profile: chill
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  related_issues: false
  related_prs: false
  suggested_labels: false
  poem: false
  in_progress_fortune: false

  path_filters:
    - "!lib/**"
    - "!node_modules/**"
    - "!node_modules.linux/**"
    - "!pnpm-lock.yaml"
    - "!assets/**"
    - "!.dsh/**"
    - "!.pi/**"

  path_instructions:
    - path: "**"
      instructions: >
        Use AGENTS.md for development requirements and docs/README.md for current
        architecture, development procedures, open work, and the ADR status index.
        Historical ADR bodies are evidence rather than current policy.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
    description:
      mode: warning

  tools:
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    hadolint:
      enabled: false
    golangci-lint:
      enabled: false
    rubocop:
      enabled: false
    checkov:
      enabled: false
    trivy:
      enabled: false
    vale:
      enabled: false
    languagetool:
      enabled: false
